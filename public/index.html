<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的第一个网站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 50%, #db2777 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }
  .card {
    text-align: center;
    padding: 60px 48px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: 560px;
    margin: 20px;
    animation: rise 0.8s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .emoji { font-size: 72px; margin-bottom: 20px; }
  h1 { font-size: 32px; margin-bottom: 12px; letter-spacing: 1px; }
  p { font-size: 16px; opacity: 0.9; line-height: 1.8; }
  .badge {
    display: inline-block;
    margin-top: 24px;
    padding: 8px 20px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .links { margin-top: 28px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .links a {
    color: #fff;
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    font-size: 14px;
    transition: all 0.2s;
  }
  .links a:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
  footer { position: fixed; bottom: 16px; width: 100%; text-align: center; font-size: 12px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>你好，世界！</h1>
    <p>这是我的第一个 Cloudflare Workers 网站<br>正运行在全球 330+ 个边缘节点上</p>
    <span class="badge">✅ 部署成功 · 完全免费</span>
    <div class="links">
      <a href="https://developers.cloudflare.com/workers/" target="_blank">📖 Workers 文档</a>
      <a href="https://dash.cloudflare.com/" target="_blank">🎛️ 控制台</a>
    </div>
  </div>
  <footer>Powered by Cloudflare Workers</footer>
</body>
</html>
